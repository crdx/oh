provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "work"
outputs = ["first round", "second round"]

[first]
prompt = "queue a message while the tool is working"
queue-after-tool-request = ["check the other path too", "and mention what you find"]

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_1","name":"work","input":{}}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_2","name":"work","input":{}}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"I checked the other path and it agrees."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Carrying on."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
