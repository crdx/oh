provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "say something worth coming back to"

[[first.response]]
event = [
    '''{"type":"message_start","message":{"usage":{"input_tokens":120,"cache_read_input_tokens":48000,"cache_creation_input_tokens":900,"output_tokens":1}}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Something worth coming back to."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "I am back after a while"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{"usage":{"input_tokens":200,"cache_read_input_tokens":0,"cache_creation_input_tokens":280000,"output_tokens":1}}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Welcome back."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
