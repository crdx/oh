provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
credential-refresh = "missing-provider"

[first]
prompt = "try without codex credentials"

[resume]
prompt = "continue after logging in to codex"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Recovered."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Recovered."}]}}''',
    '''{"type":"response.completed"}''',
]
