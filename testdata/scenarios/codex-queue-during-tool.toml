provider = "codex"
model = "gpt-5.6-sol"
effort = "high"

[[tool]]
name = "work"
outputs = ["first round", "second round"]

[first]
prompt = "queue a message while the tool is working"
queue-after-tool-request = ["check the other path too", "and mention what you find"]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"work","arguments":""}}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-1","arguments":"{}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"work","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-2","type":"function_call","call_id":"call-2","name":"work","arguments":""}}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-2","arguments":"{}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-2","type":"function_call","call_id":"call-2","name":"work","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"I checked the other path and it agrees."}''',
    '''{"type":"response.output_text.done","text":"I checked the other path and it agrees."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"I checked the other path and it agrees."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_text.done","text":"Carrying on."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
