provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[[tool]]
name = "lookup"
lookup-refused = true

[first]
prompt = "look up a topic the user will refuse"

[[first.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":null,"reasoning_content":""}}]}''',
    '''{"choices":[{"delta":{"tool_calls":[{"index":0,"id":"call-1","type":"function","function":{"name":"lookup","arguments":"{\"query\":\"current weather\"}"}}]}}]}''',
    '''{"choices":[{"delta":{"content":"","reasoning_content":""},"finish_reason":"tool_calls"}]}''',
    '''[DONE]''',
]

[[first.response]]
event = [
    '''{"choices":[{"delta":{"content":"I will not look that up then."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "continue after the refusal"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Resumed after the refusal."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
