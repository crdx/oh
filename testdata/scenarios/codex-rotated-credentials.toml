provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
credential-refresh = "rotation"

[first]
prompt = "continue after another session rotates the credentials"

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Recovered."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Recovered."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "continue after restarting the session"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Still recovered."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Still recovered."}]}}''',
    '''{"type":"response.completed"}''',
]
