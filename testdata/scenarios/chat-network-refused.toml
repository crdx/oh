provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[[tool]]
name = "bash"
network-refused = true

[first]
prompt = "run a command the user will refuse the host network"

[[first.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":null,"reasoning_content":""}}]}''',
    '''{"choices":[{"delta":{"tool_calls":[{"index":0,"id":"call-1","type":"function","function":{"name":"bash","arguments":"{\"command\":\"curl example.com\",\"network\":\"host\"}"}}]}}]}''',
    '''{"choices":[{"delta":{"content":"","reasoning_content":""},"finish_reason":"tool_calls"}]}''',
    '''[DONE]''',
]

[[first.response]]
event = [
    '''{"choices":[{"delta":{"content":"I will not run that command."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "continue after the refusal"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Carrying on without the host network."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
