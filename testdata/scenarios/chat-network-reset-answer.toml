provider = "chat"
model = "deepseek-v4-pro"
effort = "high"

[first]
prompt = "lose the network during answer prose"

[[first.response]]
reset-after-wire-event = 2
event = [
    '''{"choices":[{"delta":{"reasoning_content":"Completed thought."}}]}''',
    '''{"choices":[{"delta":{"content":"Partial answer."}}]}''',
]

[[first.response]]
event = [
    '''{"choices":[{"delta":{"content":"Through on the second attempt."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "continue after the network interruption"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Resumed."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
