provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
credential-refresh = "store-failure"

[first]
prompt = "refresh with a read-only credential store"

[resume]
prompt = "continue after the credential store recovers"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Recovered."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Recovered."}]}}''',
    '''{"type":"response.completed"}''',
]
