provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "receive HTTP 503"

[[first.response]]
repeat = 19
status = 503

[resume]
prompt = "continue after the transport failure"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Resumed."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Resumed."}]}}''',
    '''{"type":"response.completed"}''',
]
