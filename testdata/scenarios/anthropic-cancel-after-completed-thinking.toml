provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "interrupt after completing a thought"
is-cancelled = true
cancel-after-reasoning-event = 1

[[first.response]]
wait-for-cancellation = true
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"Completed thought."}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":"seal-1"}}''',
    '''{"type":"content_block_stop","index":0}''',
]

[resume]
prompt = "continue after the completed thought"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Resumed."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
