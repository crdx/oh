provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "fail on the server after thinking"

[[first.response]]
event = [
    '''{"type":"response.reasoning_summary_text.delta","delta":"Weighing the two ways round."}''',
    '''{"type":"response.reasoning_summary_part.done","part":{"type":"summary_text","text":"Weighing the two ways round."}}''',
    '''{"type":"error","error":{"type":"server_error","code":"server_error","message":"the server gave up"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Through on the second attempt."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"Through on the second attempt."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed"}''',
]
