provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "receive a top-level Responses API error"

[[first.response]]
event = [
    '''{"type":"error","error":{"type":"invalid_request_error","code":"invalid_prompt","message":"the prompt was refused"}}''',
]

[resume]
prompt = "continue after the endpoint error"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Resumed."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"Resumed."}]}}''',
    '''{"type":"response.completed"}''',
]
