provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[[tool]]
name = "notify"

[first]
prompt = "offer the notification tool without calling it"

[[first.response]]
event = [
    '''{"choices":[{"delta":{"content":"The notification tool is there when it is wanted."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "finish"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Done."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
