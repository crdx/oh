version = 14

[defaults]
caps = "rx"
effort = "high"
fast = false
tool_output = "12K"

[input]
nudge = "continue"
speed_dial = ["yes", "no"]

[ui]
streaming = "line"
grouping = ["notice", "panel", "reasoning tool", "answer"]
reasoning = "plain"

[ui.theme]
appearance = "auto"

[ui.theme.dark]
normal = "default"
dim = "#969896"
accent = "#c08050"
user = "#343541"
harness = "#303a43"
status_success = "#4c9a2c"
status_info = "#81a2be"
status_warning = "#cfad00"
status_danger = "#cc6666"
syntax_type = "#f0c674"
syntax_literal = "#b5bd68"
syntax_operator = "#8abeb7"
syntax_keyword = "#c9a6d4"
skill = "#c9a6d4"
media_image = "#7cc4e8"
media_audio = "#b294d6"
media_video = "#e0995e"
media_pdf = "#e06c75"

[ui.theme.grey-dark]
normal = "default"
dim = "#cfcfcf"
accent = "#ffc49a"
user = "#46464e"
harness = "#424b52"
status_success = "#b4f09c"
status_info = "#bcdcff"
status_warning = "#ffe27a"
status_danger = "#ffb8b8"
syntax_type = "#ffe9a8"
syntax_literal = "#e2f0a0"
syntax_operator = "#b0f4ea"
syntax_keyword = "#f2d0ff"
skill = "#f2d0ff"
media_image = "#b8e2f8"
media_audio = "#dcc8f8"
media_video = "#ffcfa0"
media_pdf = "#ffb0b8"

[ui.theme.grey-light]
normal = "default"
dim = "#383b3e"
accent = "#6a3210"
user = "#c4c4cc"
harness = "#bec8d0"
status_success = "#1f4a0f"
status_info = "#1c3d63"
status_warning = "#563f00"
status_danger = "#761616"
syntax_type = "#573a00"
syntax_literal = "#3a4700"
syntax_operator = "#0e4741"
syntax_keyword = "#562670"
skill = "#562670"
media_image = "#0f4a66"
media_audio = "#45266e"
media_video = "#6b3a0c"
media_pdf = "#7a1824"

[ui.theme.light]
normal = "default"
dim = "#6e7175"
accent = "#a65d2e"
user = "#e8e8ef"
harness = "#e2eaf0"
status_success = "#3a7d1f"
status_info = "#3d6d9a"
status_warning = "#8f6a00"
status_danger = "#b83c3c"
syntax_type = "#8a5f00"
syntax_literal = "#5f7300"
syntax_operator = "#2c7870"
syntax_keyword = "#8a4fa3"
skill = "#8a4fa3"
media_image = "#2a7aa6"
media_audio = "#6e4aa8"
media_video = "#b0601c"
media_pdf = "#b8343f"

[ui.theme.tool]
read.default = { name = "read" }
skill.default = { name = "load", paint = "skill", focus = "skill" }
ls.default = { name = "ls" }
find.default = { name = "find" }
grep.default = { name = "grep" }
write.default = { name = "write" }
edit.default = { name = "edit" }
lookup.default = { name = "lookup", paint = "status_info" }
fetch.default = { name = "fetch", paint = "status_info" }
notify.default = { name = "notify" }
title.default = { name = "title" }

[ui.theme.tool.bash]
default = { name = "$", paint = "status_info" }
host_network = { name = "$", paint = "status_danger" }

[ui.theme.tool.job]
default = { name = "job", paint = "status_warning" }
start = {}
stop = {}
restart = {}
discard = {}
prune = {}
status = { paint = "normal" }
output = { name = "cat", paint = "normal" }
list = { paint = "normal" }

[ui.theme.tool.subagent]
default = { name = "subagent", paint = "status_warning" }
start = { name = "spawn" }
send = {}
stop = {}
status = { paint = "normal" }
output = { name = "cat", paint = "normal" }
list = { paint = "normal" }
models = { name = "list", paint = "normal" }

[ui.theme.tool.forward]
default = { name = "forward", paint = "status_warning" }
add = { name = "forward" }
remove = { name = "close" }
list = { paint = "normal" }

[permissions]
network = "ask"
fetch = "ask"
lookup = "allow"

[snippets]

[tools]

[experimental]
audio_attachment_limit = "5M"
cache_miss_notices = false
command_starts_turn = true
enter_interrupts = false
image_attachment_limit = "20M"
pdf_attachment_limit = "5M"
redraw_timing_feedback = false
reply_command = false
shared_history = false
video_attachment_limit = "5M"

[debug]
stalls = false
cpu_profile = false
heap_profile = false
wire = false

[subagent]
concurrency = 5

[provider.ollama]

[skills]
include = []
exclude = []

[sandbox]
deny = []
read = []
write = []
exec = []
home = []

[bar.top]
left = [
    { segment = "activity-spinner" },
    { segment = "mode-toggle" },
    { segment = "forwards" },
    { segment = "jobs" },
    { segment = "grants", type = "base" },
]
center = [
]
right = [
    { segment = "active-model" },
    { segment = "context-usage" },
    { segment = "scroll-overflow", direction = "up" },
]

[bar.bottom]
left = [
    { segment = "workspace-dir", type = "base" },
    { segment = "git-status" },
    { segment = "git-branch" },
]
center = [
    { segment = "session-name", emoji = true },
    { segment = "subagents" },
]
right = [
    { segment = "subscription-usage" },
    { segment = "scroll-overflow", direction = "down" },
]
