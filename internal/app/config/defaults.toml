version = 11

[caps]
default = "rx"

[editor]
command = []

[input]
nudge = "continue"
speed_dial = ["yes", "no"]

[ui]
streaming = "line"
grouping = ["notice", "panel", "reasoning tool", "answer"]
reasoning = "plain"
currency = ""

[ui.theme]
normal = "default"
dim = "#969896"
accent = "#c08050"
user = "#343541"
harness = "#303a43"
status_success = "#4c9a2c"
status_info = "#81a2be"
status_warning = "#cfad00"
status_danger = "#cc6666"
syntax_type = "#f0c674"
syntax_literal = "#b5bd68"
syntax_operator = "#8abeb7"
syntax_keyword = "#c9a6d4"
skill = "#c9a6d4"

[ui.theme.tool]
read = { name = "read" }
skill = { name = "load", paint = "skill", focus = "skill" }
ls = { name = "ls" }
find = { name = "find" }
grep = { name = "grep" }
write = { name = "write" }
edit = { name = "edit" }
bash = { name = "$", paint = "status_info" }
bash_host_network = { name = "$", paint = "status_danger" }

job = { name = "job" }
job_start = { name = "start", paint = "status_warning" }
job_stop = { name = "stop", paint = "status_warning" }
job_restart = { name = "restart", paint = "status_warning" }
job_discard = { name = "discard", paint = "status_warning" }
job_prune = { name = "prune", paint = "status_warning" }
job_status = { name = "status", paint = "normal" }
job_output = { name = "output", paint = "normal" }
job_wait_any = { name = "await", paint = "normal" }
job_wait_all = { name = "await", paint = "normal" }
job_list = { name = "list", paint = "normal" }

expose = { name = "expose" }
expose_add = { name = "forward", paint = "status_warning" }
expose_remove = { name = "close", paint = "status_warning" }
expose_list = { name = "list", paint = "normal" }

lookup = { name = "lookup", paint = "status_info" }
fetch = { name = "fetch", paint = "status_info" }
notify = { name = "notify" }
title = { name = "title" }

[tool]
output = "12K"

[permissions]
network = "ask"
fetch = "ask"
lookup = "allow"

[snippets]

[tools]

[experimental]

[model]
effort = "high"
fast = false

[provider.ollama]

[ports]
hostname = ""

[skills]
include = []
exclude = []

[sandbox]
deny = []
read = []
write = []
exec = []
home = []

[bar.top]
left = [
    { segment = "activity-spinner", idle = "·✦·", frames = ["✦··", "·✦·", "··✦", "··✦", "·✦·", "✦··"], rate = "125ms" },
    { segment = "exposed-ports" },
    { segment = "jobs" },
]
center = [
    { segment = "active-model" },
    { segment = "context-usage" },
]
right = [
    { segment = "scroll-overflow", direction = "up" }
]

[bar.bottom]
left = [
    { segment = "mode-toggle" },
    { segment = "workspace-dir", type = "base" },
    { segment = "path-grants", type = "base" },
]
center = [
    { segment = "subscription-usage" },
]
right = [
    { segment = "session-name", emoji = true },
    { segment = "scroll-overflow", direction = "down" }
]
