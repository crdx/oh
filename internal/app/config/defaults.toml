version = 13

[caps]
default = "rx"

[editor]
command = []

[input]
nudge = "continue"
speed_dial = ["yes", "no"]

[ui]
streaming = "line"
grouping = ["notice", "panel", "reasoning tool", "answer"]
reasoning = "plain"
currency = ""

[ui.theme]
appearance = "auto"

[ui.theme.dark]
normal = "default"
dim = "#969896"
accent = "#c08050"
user = "#343541"
harness = "#303a43"
status_success = "#4c9a2c"
status_info = "#81a2be"
status_warning = "#cfad00"
status_danger = "#cc6666"
syntax_type = "#f0c674"
syntax_literal = "#b5bd68"
syntax_operator = "#8abeb7"
syntax_keyword = "#c9a6d4"
skill = "#c9a6d4"

[ui.theme.grey-dark]
normal = "default"
dim = "#cfcfcf"
accent = "#ffc49a"
user = "#46464e"
harness = "#424b52"
status_success = "#b4f09c"
status_info = "#bcdcff"
status_warning = "#ffe27a"
status_danger = "#ffb8b8"
syntax_type = "#ffe9a8"
syntax_literal = "#e2f0a0"
syntax_operator = "#b0f4ea"
syntax_keyword = "#f2d0ff"
skill = "#f2d0ff"

[ui.theme.grey-light]
normal = "default"
dim = "#383b3e"
accent = "#6a3210"
user = "#c4c4cc"
harness = "#bec8d0"
status_success = "#1f4a0f"
status_info = "#1c3d63"
status_warning = "#563f00"
status_danger = "#761616"
syntax_type = "#573a00"
syntax_literal = "#3a4700"
syntax_operator = "#0e4741"
syntax_keyword = "#562670"
skill = "#562670"

[ui.theme.light]
normal = "default"
dim = "#6e7175"
accent = "#a65d2e"
user = "#e8e8ef"
harness = "#e2eaf0"
status_success = "#3a7d1f"
status_info = "#3d6d9a"
status_warning = "#8f6a00"
status_danger = "#b83c3c"
syntax_type = "#8a5f00"
syntax_literal = "#5f7300"
syntax_operator = "#2c7870"
syntax_keyword = "#8a4fa3"
skill = "#8a4fa3"

[ui.theme.tool]
read.default = { name = "read" }
skill.default = { name = "load", paint = "skill", focus = "skill" }
ls.default = { name = "ls" }
find.default = { name = "find" }
grep.default = { name = "grep" }
write.default = { name = "write" }
edit.default = { name = "edit" }
lookup.default = { name = "lookup", paint = "status_info" }
fetch.default = { name = "fetch", paint = "status_info" }
notify.default = { name = "notify" }
title.default = { name = "title" }

[ui.theme.tool.bash]
default = { name = "$", paint = "status_info" }
host_network = { name = "$", paint = "status_danger" }

[ui.theme.tool.job]
default = { name = "job", paint = "status_warning" }
start = {}
stop = {}
restart = {}
discard = {}
prune = {}
status = { paint = "normal" }
output = { name = "cat", paint = "normal" }
wait_any = { name = "await", paint = "normal" }
wait_all = { name = "await", paint = "normal" }
list = { paint = "normal" }

[ui.theme.tool.subagent]
default = { name = "subagent", paint = "status_warning" }
start = { name = "spawn" }
send = {}
stop = {}
status = { paint = "normal" }
output = { name = "cat", paint = "normal" }
wait = { name = "await", paint = "normal" }
list = { paint = "normal" }

[ui.theme.tool.forward]
default = { name = "forward", paint = "status_warning" }
add = { name = "forward" }
remove = { name = "close" }
list = { paint = "normal" }

[tool]
output = "12K"

[permissions]
network = "ask"
fetch = "ask"
lookup = "allow"

[snippets]

[tools]

[experimental]
command_starts_turn = true
redraw_timing_feedback = false

[debug]
stalls = false
cpu_profile = false
heap_profile = false

[model]
effort = "high"
fast = false

[subagent]
model = ""

[provider.ollama]

[ports]
hostname = ""

[skills]
include = []
exclude = []

[sandbox]
deny = []
read = []
write = []
exec = []
home = []

[bar.top]
left = [
    { segment = "activity-spinner", idle = "·✦·", frames = ["✦··", "·✦·", "··✦", "··✦", "·✦·", "✦··"], rate = "100ms" },
    { segment = "mode-toggle" },
    { segment = "forwards" },
    { segment = "jobs" },
    { segment = "subagents" },
    { segment = "grants", type = "base" },
]
center = [
]
right = [
    { segment = "active-model" },
    { segment = "context-usage" },
    { segment = "scroll-overflow", direction = "up" },
]

[bar.bottom]
left = [
    { segment = "workspace-dir", type = "base" },
    { segment = "git-status" },
    { segment = "git-branch" },
]
center = [
    { segment = "session-name", emoji = true },
]
right = [
    { segment = "subscription-usage" },
    { segment = "scroll-overflow", direction = "down" },
]
