version = 12

[caps]
default = "rx"

[editor]
command = []

[input]
nudge = "continue"
speed_dial = ["yes", "no"]

[ui]
streaming = "line"
grouping = ["notice", "panel", "reasoning tool", "answer"]
reasoning = "plain"
currency = ""

[ui.theme]
normal = "default"
dim = "#969896"
accent = "#c08050"
user = "#343541"
harness = "#303a43"
status_success = "#4c9a2c"
status_info = "#81a2be"
status_warning = "#cfad00"
status_danger = "#cc6666"
syntax_type = "#f0c674"
syntax_literal = "#b5bd68"
syntax_operator = "#8abeb7"
syntax_keyword = "#c9a6d4"
skill = "#c9a6d4"

[ui.theme.tool]
read.default = { name = "read" }
skill.default = { name = "load", paint = "skill", focus = "skill" }
ls.default = { name = "ls" }
find.default = { name = "find" }
grep.default = { name = "grep" }
write.default = { name = "write" }
edit.default = { name = "edit" }
lookup.default = { name = "lookup", paint = "status_info" }
fetch.default = { name = "fetch", paint = "status_info" }
notify.default = { name = "notify" }
title.default = { name = "title" }

[ui.theme.tool.bash]
default = { name = "$", paint = "status_info" }
host_network = { name = "$", paint = "status_danger" }

[ui.theme.tool.job]
default = { name = "job", paint = "status_warning" }
start = {}
stop = {}
restart = {}
discard = {}
prune = {}
status = { paint = "normal" }
output = { name = "cat", paint = "normal" }
wait_any = { name = "await", paint = "normal" }
wait_all = { name = "await", paint = "normal" }
list = { paint = "normal" }

[ui.theme.tool.forward]
default = { name = "forward", paint = "status_warning" }
add = { name = "forward" }
remove = { name = "close" }
list = { paint = "normal" }

[tool]
output = "12K"

[permissions]
network = "ask"
fetch = "ask"
lookup = "allow"

[snippets]

[tools]

[experimental]
command_starts_turn = true

[model]
effort = "high"
fast = false

[provider.ollama]

[ports]
hostname = ""

[skills]
include = []
exclude = []

[sandbox]
deny = []
read = []
write = []
exec = []
home = []

[bar.top]
left = [
    { segment = "activity-spinner", idle = "·✦·", frames = ["✦··", "·✦·", "··✦", "··✦", "·✦·", "✦··"], rate = "100ms" },
    { segment = "mode-toggle" },
    { segment = "forwards" },
    { segment = "jobs" },
    { segment = "grants", type = "base" },
]
center = [
]
right = [
    { segment = "active-model" },
    { segment = "context-usage" },
    { segment = "scroll-overflow", direction = "up" },
]

[bar.bottom]
left = [
    { segment = "workspace-dir", type = "base" },
    { segment = "git-branch" },
    { segment = "session-name", emoji = true },
]
center = [
]
right = [
    { segment = "subscription-usage" },
    { segment = "scroll-overflow", direction = "down" },
]
