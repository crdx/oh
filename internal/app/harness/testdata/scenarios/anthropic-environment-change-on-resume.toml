provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[environment]
deny = ["old-secret.yml", "shared-secret.yml"]
read = ["/old/reference", "/shared/reference"]
write = ["/old/output"]
exec = ["/old/bin"]
path = ["/old/path", "/shared/path"]
home = ["/test-home/.oldrc"]
repository = false
hostname = "old.agent.test"

[[environment.skill]]
name = "changed"
description = "use the old process"
location = "/skills/changed/SKILL.md"

[[environment.skill]]
name = "removed"
description = "use the removed process"
location = "/skills/removed/SKILL.md"

[[environment.skill]]
name = "renamed-old"
description = "use the renamed process"
location = "/skills/renamed/SKILL.md"

[[environment.skill]]
name = "moved"
description = "use the moved process"
location = "/skills/moved-old/SKILL.md"

[environment-on-resume]
deny = ["new-secret.yml", "shared-secret.yml"]
read = ["/new/reference", "/shared/reference"]
write = ["/new/output"]
exec = ["/new/bin"]
path = ["/shared/path", "/new/path"]
home = ["/test-home/.newrc"]
repository = true
hostname = "new.agent.test"

[[environment-on-resume.skill]]
name = "added"
description = "use the added process"
location = "/skills/added/SKILL.md"

[[environment-on-resume.skill]]
name = "changed"
description = "use the new process"
location = "/skills/changed/SKILL.md"

[[environment-on-resume.skill]]
name = "renamed-new"
description = "use the renamed process"
location = "/skills/renamed/SKILL.md"

[[environment-on-resume.skill]]
name = "moved"
description = "use the moved process"
location = "/skills/moved-new/SKILL.md"

[first]
prompt = "remember the environment"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"I have the original environment."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "what changed"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"The queued harness update describes the complete delta."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
