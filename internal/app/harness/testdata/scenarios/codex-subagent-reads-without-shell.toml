prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-45","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
