provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[subagent]]
name = "tame-adder"

[[subagent.response]]
wait-for-cancellation = true

[first]
prompt = "start a subagent under a name of your own and address it by that name"
settle-subagents-after-tool-result = 1
settle-subagents-after-turn = true

