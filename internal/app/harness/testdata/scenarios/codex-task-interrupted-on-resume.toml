provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
tasks-running-into-resume = ["build"]

[[tool]]
name = "bash"
outputs = ["restarted command"]

[[tool]]
name = "task"

[first]
prompt = "remember this running task"

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-1","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"I will check it later."}''',
    '''{"type":"response.output_text.done","text":"I will check it later."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"I will check it later."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"I will check it later."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "what happened to build"
settle-tasks-after-tool-result = true

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-2","type":"function_call","call_id":"call-1","name":"task","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-2","delta":"{\"action\":\"status\",\"name\":\"build\"}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-2","arguments":"{\"action\":\"status\",\"name\":\"build\"}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-2","type":"function_call","call_id":"call-1","name":"task","arguments":"{\"action\":\"status\",\"name\":\"build\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

