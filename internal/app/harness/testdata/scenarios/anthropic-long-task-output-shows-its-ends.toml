provider = "anthropic"
model = "claude-opus-5"
effort = "medium"
end-task-before-first = "build"
end-task-output = "ok  crdx.org/oh/internal/app/config\nok  crdx.org/oh/internal/app/painter\nok  crdx.org/oh/internal/app/taskrecord\nok  crdx.org/oh/internal/app/toolresult\nok  crdx.org/oh/internal/toolresult\nok  crdx.org/oh/pkg/agent\nok  crdx.org/oh/pkg/tasks\n--- FAIL: TestDraw (0.00s)\nFAIL crdx.org/oh/cmd/oh"
end-task-intent = "Running every package test once more"
task-output-lines = 3

[first]
prompt = "what happened to the build"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"It failed after twelve seconds: getWidth is undefined in draw.go."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Carrying on."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
