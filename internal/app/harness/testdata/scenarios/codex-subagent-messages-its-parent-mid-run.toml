provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "probe"
outputs = ["first probe"]

[[subagent]]
name = "tame-adder"

[[subagent.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-11","type":"function_call","call_id":"toolu_21","name":"message_parent","arguments":"{\"message\":\"The parser is in parse.go. Should I check its tests too?\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed","usage":{"input_tokens":1200,"output_tokens":40,"input_tokens_details":{"cached_tokens":0,"cache_write_tokens":0}}}}''',
]

[[subagent.response]]
wait-for-message = true
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-12","type":"function_call","call_id":"toolu_22","name":"message_parent","arguments":"{\"message\":\"Checking the tests now.\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed","usage":{"input_tokens":1300,"output_tokens":30,"input_tokens_details":{"cached_tokens":0,"cache_write_tokens":0}}}}''',
]

[[subagent.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-13","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The parser is in parse.go, and its tests are in parse_test.go."}''',
    '''{"type":"response.output_text.done","text":"The parser is in parse.go, and its tests are in parse_test.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The parser is in parse.go, and its tests are in parse_test.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-13","type":"message","role":"assistant","content":[{"type":"output_text","text":"The parser is in parse.go, and its tests are in parse_test.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed","usage":{"input_tokens":1500,"output_tokens":20,"input_tokens_details":{"cached_tokens":0,"cache_write_tokens":0}}}}''',
]

[first]
prompt = "start a subagent and keep working"
settle-subagents-after-tool-result = 2
settle-subagents-after-turn = true
subagent-debounce-passes = true

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-14","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"model\":\"codex/gpt-5.6-sol@medium\",\"prompt\":\"Find the parser\",\"intent\":\"Finding where the parser lives\"}]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-15","type":"function_call","call_id":"toolu_2","name":"probe","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-16","type":"function_call","call_id":"toolu_3","name":"subagent","arguments":"{\"action\":\"send\",\"name\":\"tame-adder\",\"message\":\"Yes, check its tests too\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-17","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Asked it to check the tests too."}''',
    '''{"type":"response.output_text.done","text":"Asked it to check the tests too."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Asked it to check the tests too."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-17","type":"message","role":"assistant","content":[{"type":"output_text","text":"Asked it to check the tests too."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-18","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The tests are in parse_test.go."}''',
    '''{"type":"response.output_text.done","text":"The tests are in parse_test.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The tests are in parse_test.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-18","type":"message","role":"assistant","content":[{"type":"output_text","text":"The tests are in parse_test.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
