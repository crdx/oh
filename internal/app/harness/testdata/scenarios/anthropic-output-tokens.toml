provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "count what the answer cost"

[[first.response]]
event = [
    '''{"type":"message_start","message":{"usage":{"input_tokens":200,"cache_read_input_tokens":4000,"cache_creation_input_tokens":800,"output_tokens":1}}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"Thinking about the cost."}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":"seal-1"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":"That cost a little."}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"},"usage":{"output_tokens":320}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "answer without thinking first"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{"usage":{"input_tokens":260,"cache_read_input_tokens":5000,"cache_creation_input_tokens":0,"output_tokens":1}}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Answered."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"},"usage":{"output_tokens":90}}''',
    '''{"type":"message_stop"}''',
]
