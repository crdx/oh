provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "title"

[[tool]]
name = "work"
outputs = ["the first part is done", "the second part is done", "the third part is done"]

[first]
prompt = "split the picker into its own package"

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"item-call-1","type":"function_call","call_id":"call-1","name":"work","arguments":"{}"}}''',
    '''{"type":"response.completed"}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"item-call-2","type":"function_call","call_id":"call-2","name":"work","arguments":"{}"}}''',
    '''{"type":"response.completed"}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"The picker has its own package now."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"The picker has its own package now."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"item-call-3","type":"function_call","call_id":"call-3","name":"title","arguments":"{\"title\":\"split picker package\"}"}}''',
    '''{"type":"response.completed"}''',
]

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Named it, as asked."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Named it, as asked."}]}}''',
    '''{"type":"response.completed"}''',
]
