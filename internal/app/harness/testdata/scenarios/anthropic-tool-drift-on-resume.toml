provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "stable"
outputs = ["stable output"]

[[tool]]
name = "changed"
outputs = ["original changed output"]
on-resume = "changed"

[[tool]]
name = "revision"
outputs = ["original revision output"]
on-resume = "revision"

[[tool]]
name = "schema"
outputs = ["original schema output"]
on-resume = "schema"

[[tool]]
name = "compatible"
outputs = ["compatible output"]
on-resume = "compatible"

[[tool]]
name = "missing"
outputs = ["original missing output"]
on-resume = "missing"

[[tool]]
name = "added"
outputs = ["added output"]
on-resume = "added"

[first]
prompt = "use every original tool"

