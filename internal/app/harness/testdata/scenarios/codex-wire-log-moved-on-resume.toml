provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[environment]
deny = ["secret.yml"]
read = ["/reference"]
repository = true
hostname = "session.agent.test"

[[environment.skill]]
name = "steady"
description = "use the steady process"
location = "/skills/steady/SKILL.md"

[environment-on-resume]
deny = ["secret.yml"]
read = ["/reference"]
repository = true
hostname = "session.agent.test"
wire-log-path = "debug/wire.http.zst"

[[environment-on-resume.skill]]
name = "steady"
description = "use the steady process"
location = "/skills/steady/SKILL.md"

[first]
prompt = "remember what is available"

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-1","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"I have the original environment."}''',
    '''{"type":"response.output_text.done","text":"I have the original environment."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"I have the original environment."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"I have the original environment."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "what was lost"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-2","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"I see the new wire log path."}''',
    '''{"type":"response.output_text.done","text":"I see the new wire log path."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"I see the new wire log path."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"I see the new wire log path."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
