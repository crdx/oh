provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "grep"
runner = "unconfined"

[[tool]]
name = "edit"

[first]
prompt = "find the error, then fix its wording"

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"type":"function_call","call_id":"call-1","name":"grep","arguments":"{\"pattern\":\"ERROR\"}"}}''',
    '''{"type":"response.completed"}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"type":"function_call","call_id":"call-2","name":"edit","arguments":"{\"path\":\"server.log\",\"old_text\":\"disk full\",\"new_text\":\"the disk is full\"}"}}''',
    '''{"type":"response.completed"}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Reworded."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Reworded."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "finish"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Done."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Done."}]}}''',
    '''{"type":"response.completed"}''',
]
