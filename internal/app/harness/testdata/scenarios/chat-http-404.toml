provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[first]
prompt = "receive HTTP 404"

[[first.response]]
status = 404

[resume]
prompt = "continue after the missing endpoint"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Resumed."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
