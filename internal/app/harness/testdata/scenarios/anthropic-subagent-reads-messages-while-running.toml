event = [
    '''{"type":"message_start","message":{"usage":{"input_tokens":1200,"output_tokens":1}}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_21","name":"bash","input":{}}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":"{\"command\":\"ls\",\"intent\":\"Listing the workspace files\"}"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"},"usage":{"output_tokens":40}}''',
