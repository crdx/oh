provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "probe"
outputs = ["first probe", "second probe"]

[[subagent]]
name = "tame-adder"

[[subagent.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-11","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The parser is in parse.go."}''',
    '''{"type":"response.output_text.done","text":"The parser is in parse.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The parser is in parse.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-11","type":"message","role":"assistant","content":[{"type":"output_text","text":"The parser is in parse.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[first]
prompt = "start a subagent and keep working"
settle-subagents-after-tool-result = 2
subagent-debounce-passes = true

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-12","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"prompt\":\"Find the parser\",\"intent\":\"Finding where the parser lives\"}]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-13","type":"function_call","call_id":"toolu_2","name":"probe","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-14","type":"function_call","call_id":"toolu_3","name":"probe","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-15","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The subagent found the parser in parse.go while I probed."}''',
    '''{"type":"response.output_text.done","text":"The subagent found the parser in parse.go while I probed."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The subagent found the parser in parse.go while I probed."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-15","type":"message","role":"assistant","content":[{"type":"output_text","text":"The subagent found the parser in parse.go while I probed."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-16","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_text.done","text":"Carrying on."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Carrying on."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-16","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
