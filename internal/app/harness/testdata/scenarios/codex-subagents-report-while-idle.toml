provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "work"
outputs = ["parse.go: func Parse"]

[[subagent]]
name = "tame-adder"

[[subagent.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-5","type":"function_call","call_id":"toolu_c1","name":"work","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[subagent.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-6","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The parser starts at parse.go."}''',
    '''{"type":"response.output_text.done","text":"The parser starts at parse.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The parser starts at parse.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-6","type":"message","role":"assistant","content":[{"type":"output_text","text":"The parser starts at parse.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[subagent]]
name = "tame-alpaca"

[[subagent.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-7","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"There are three open TODO items."}''',
    '''{"type":"response.output_text.done","text":"There are three open TODO items."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"There are three open TODO items."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-7","type":"message","role":"assistant","content":[{"type":"output_text","text":"There are three open TODO items."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[first]
prompt = "split the review between two subagents"
settle-subagents-after-turn = true
subagent-debounce-passes = true

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-1","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"prompt\":\"Read the parser and report its entry point\",\"intent\":\"Reading the parser's entry point\"},{\"prompt\":\"Count the open TODO items\",\"intent\":\"Counting the open TODO items\"}],\"system_prompt\":\"Answer in one sentence.\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-2","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Two subagents are working on it."}''',
    '''{"type":"response.output_text.done","text":"Two subagents are working on it."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Two subagents are working on it."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Two subagents are working on it."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-3","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Both reported: the parser starts at parse.go and there are three open TODO items."}''',
    '''{"type":"response.output_text.done","text":"Both reported: the parser starts at parse.go and there are three open TODO items."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Both reported: the parser starts at parse.go and there are three open TODO items."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-3","type":"message","role":"assistant","content":[{"type":"output_text","text":"Both reported: the parser starts at parse.go and there are three open TODO items."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

