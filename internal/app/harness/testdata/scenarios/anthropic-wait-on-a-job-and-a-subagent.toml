provider = "anthropic"
model = "claude-opus-5"
effort = "medium"
with-wait-tool = true

[[tool]]
name = "job"
runs = true

[[subagent]]
name = "tame-adder"

[[subagent.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"The parser is in parse.go."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[first]
prompt = "build in the background, ask a subagent, and wait for them"
settle-subagents-after-tool-result = 2

