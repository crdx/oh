provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[environment]
deny = ["secret.yml"]
read = ["/reference"]
repository = true
hostname = "session.agent.test"

[[environment.skill]]
name = "steady"
description = "use the steady process"
location = "/skills/steady/SKILL.md"

[first]
prompt = "remember the environment"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"I have it."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Nothing changed."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
