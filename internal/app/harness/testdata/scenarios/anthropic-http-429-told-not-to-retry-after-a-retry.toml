provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "receive a rate limit, then one that says not to ask again"

[[first.response]]
status = 429
body = '''{"type":"error","error":{"type":"rate_limit_error","message":"rate limit exceeded"},"request_id":"request-1"}'''
headers = { Content-Type = "application/json", Retry-After = "1" }

[[first.response]]
status = 429
body = '''{"error":{"message":"Usage credits are required for fast mode.","type":"rate_limit_error"},"request_id":"request-2","type":"error"}'''
headers = { Content-Type = "application/json", X-Should-Retry = "false" }

[resume]
prompt = "continue after the final refusal"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Resumed."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
