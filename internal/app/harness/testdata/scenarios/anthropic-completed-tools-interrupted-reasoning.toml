provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "work"
outputs = ["first result", "second result", "resumed result"]
state-key = "work-count"

[first]
prompt = "complete two tool rounds, then keep thinking"
is-cancelled = true
cancel-after-reasoning-delta = 3

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"Plan first."}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":"seal-1"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"tool_use","id":"toolu_1","name":"work","input":{}}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"Plan second."}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":"seal-2"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"tool_use","id":"toolu_2","name":"work","input":{}}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[first.response]]
wait-for-cancellation = true
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"This must disappear."}}''',
]

[resume]
prompt = "continue from the last valid tool result"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"Check restored state."}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":"seal-3"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"tool_use","id":"toolu_3","name":"work","input":{}}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Recovered."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
