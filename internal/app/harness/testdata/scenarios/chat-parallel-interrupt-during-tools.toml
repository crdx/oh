provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[[tool]]
name = "alpha"
outputs = ["alpha result"]
state-key = "alpha-count"

[[tool]]
name = "beta"
blocks = true

[first]
prompt = "call two tools and interrupt while the second is working"
cancel-after-tool-request = 2
is-cancelled = true

[[first.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":null}}]}''',
    '''{"choices":[{"delta":{"tool_calls":[{"index":0,"id":"call-1","type":"function","function":{"name":"alpha","arguments":"{}"}}]}}]}''',
    '''{"choices":[{"delta":{"tool_calls":[{"index":1,"id":"call-2","type":"function","function":{"name":"beta","arguments":"{}"}}]}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"tool_calls"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "what happened to the second one"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"It never finished."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
