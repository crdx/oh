provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[[tool]]
name = "job"

[first]
prompt = "state the job name rules"

[[first.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":"Use one short role such as `check`; a simultaneous duplicate is automatically named `check-1`."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Carrying on."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
