provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "change what I am allowed to do twice over, once in each turn"
toggle-after-message-delta = "w"
toggle-during-mode-turn = "g"
is-cancelled = true

[[first.response]]
wait-for-cancellation = true
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-1","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Half an ans"}''',
]

[[first.response]]
wait-for-cancellation = true
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-2","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The workspace is read-onl"}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-3","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The history is read-only now."}''',
    '''{"type":"response.output_text.done","text":"The history is read-only now."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The history is read-only now."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-3","type":"message","role":"assistant","content":[{"type":"output_text","text":"The history is read-only now."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-4","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_text.done","text":"Carrying on."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Carrying on."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-4","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
