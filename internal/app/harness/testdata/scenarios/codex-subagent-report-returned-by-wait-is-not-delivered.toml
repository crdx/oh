[first]
prompt = "ask two subagents and wait for them"
settle-subagents-after-turn = true
subagent-debounce-passes = true

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-45","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"prompt\":\"Find the config loader\",\"intent\":\"Finding where the config loads\"},{\"prompt\":\"Find the parser\",\"intent\":\"Finding where the parser lives\"}]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-46","type":"function_call","call_id":"toolu_2","name":"subagent","arguments":"{\"action\":\"wait\",\"names\":[]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-47","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Both reported: the loader is in config.go and the parser is in parse.go."}''',
    '''{"type":"response.output_text.done","text":"Both reported: the loader is in config.go and the parser is in parse.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Both reported: the loader is in config.go and the parser is in parse.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-47","type":"message","role":"assistant","content":[{"type":"output_text","text":"Both reported: the loader is in config.go and the parser is in parse.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

