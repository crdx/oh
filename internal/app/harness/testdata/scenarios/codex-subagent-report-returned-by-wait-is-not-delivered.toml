[[subagent]]
name = "tame-alpaca"

[[subagent.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-50","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
