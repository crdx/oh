    '''{"type":"response.output_text.done","text":"The parser is in parse.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The parser is in parse.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-50","type":"message","role":"assistant","content":[{"type":"output_text","text":"The parser is in parse.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
