provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "work"
outputs = ["done"]

[first]
prompt = "lose the prompt cache halfway through the turn"

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"work","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"usage":{"input_tokens":48900,"output_tokens":20,"input_tokens_details":{"cached_tokens":48000,"cache_write_tokens":0}}}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"The cache went cold on that request."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"The cache went cold on that request."}]}}''',
    '''{"type":"response.completed","response":{"usage":{"input_tokens":49300,"output_tokens":20,"input_tokens_details":{"cached_tokens":0,"cache_write_tokens":0}}}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"usage":{"input_tokens":49500,"output_tokens":10,"input_tokens_details":{"cached_tokens":49152,"cache_write_tokens":0}}}}''',
]
