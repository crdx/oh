provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[subagent]]
name = "tame-adder"

[[subagent.response]]
wait-for-cancellation = true

[first]
prompt = "exercise every subagent action"
settle-subagents-after-tool-result = 1
settle-subagents-after-turn = true

