provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
conditions = "unix-sockets ipv6 interactive"
conditions-on-resume = "none"

[first]
prompt = "listen on a Unix socket"

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-1","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"A socket beneath /tmp it is."}''',
    '''{"type":"response.output_text.done","text":"A socket beneath /tmp it is."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"A socket beneath /tmp it is."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"A socket beneath /tmp it is."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "listen on it again"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-2","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Not any more, so 127.0.0.1 it is."}''',
    '''{"type":"response.output_text.done","text":"Not any more, so 127.0.0.1 it is."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Not any more, so 127.0.0.1 it is."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Not any more, so 127.0.0.1 it is."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
