provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "think twice"
[[first.response]]
event = [
    '''{"type":"response.reasoning_summary_text.delta","delta":"**First thought**"}''',
    '''{"type":"response.reasoning_summary_part.done","part":{"type":"summary_text","text":"**First thought**"}}''',
    '''{"type":"response.reasoning_summary_text.delta","delta":"**Second thought**"}''',
    '''{"type":"response.reasoning_summary_part.done","part":{"type":"summary_text","text":"**Second thought**"}}''',
    '''{"type":"response.output_item.done","item":{"id":"reasoning-1","type":"reasoning","content":[],"encrypted_content":"sealed","summary":[{"type":"summary_text","text":"**First thought**"},{"type":"summary_text","text":"**Second thought**"}]}}''',
    '''{"type":"response.output_text.delta","delta":"Done."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Done."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "continue after both thoughts"
[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Resumed."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Resumed."}]}}''',
    '''{"type":"response.completed"}''',
]
