provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "has the build finished"
is-cancelled = true
end-job-after-message-delta = "build"
cancel-after-message-delta = 2

[[first.response]]
wait-for-cancellation = true
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"The build "}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"is still "}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Carrying on."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
