provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[subagent]]
name = "tame-adder"

[[subagent.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-12","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The config loader is in config.go."}''',
    '''{"type":"response.output_text.done","text":"The config loader is in config.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The config loader is in config.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-12","type":"message","role":"assistant","content":[{"type":"output_text","text":"The config loader is in config.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[first]
prompt = "ask a subagent to find the config loader"
settle-subagents-after-tool-result = 1
subagent-debounce-passes = true
queue-after-message-delta = ["what did it find?"]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-8","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"prompt\":\"Find the config loader\",\"intent\":\"Finding where the config loads\"}]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-9","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"It is looking; I will summarise when you ask."}''',
    '''{"type":"response.output_text.done","text":"It is looking; I will summarise when you ask."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"It is looking; I will summarise when you ask."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-9","type":"message","role":"assistant","content":[{"type":"output_text","text":"It is looking; I will summarise when you ask."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-10","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"It found the loader in config.go, as its report says."}''',
    '''{"type":"response.output_text.done","text":"It found the loader in config.go, as its report says."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"It found the loader in config.go, as its report says."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-10","type":"message","role":"assistant","content":[{"type":"output_text","text":"It found the loader in config.go, as its report says."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-11","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_text.done","text":"Carrying on."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Carrying on."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-11","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
