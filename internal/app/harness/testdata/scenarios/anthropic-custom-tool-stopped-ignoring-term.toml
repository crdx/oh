provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "kitchen"
holds-stop-until-ready = true
declared = '''
trap '' TERM
echo "sharpening the knives"
touch "$1"
sleep 60 &
wait $!
'''

[first]
prompt = "stop the kitchen while it works"
cancel-after-tool-request = 1
is-cancelled = true

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_1","name":"kitchen","input":{}}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":"{\"dish\":\"julienned carrots\"}"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "what did it manage to do"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"It sharpened the knives and would not stop until it was killed."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
