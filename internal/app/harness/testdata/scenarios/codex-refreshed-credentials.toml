provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
credential-refresh = "success"

[first]
prompt = "continue after refreshing the credentials"

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Refreshed."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Refreshed."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "continue with the stored refresh"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Still refreshed."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Still refreshed."}]}}''',
    '''{"type":"response.completed"}''',
]
