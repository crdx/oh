provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "kitchen"
declared = '''
sleep 60 &
(sleep 0.5; echo "a helper outlived the call") &
echo "plated up"
'''

[first]
prompt = "plate something up"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_1","name":"kitchen","input":{}}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":"{\"dish\":\"burnt offering\"}"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"It plated up."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Carrying on."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
