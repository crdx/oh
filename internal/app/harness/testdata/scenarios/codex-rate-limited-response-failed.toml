provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "be rate limited before the answer"

[[first.response]]
event = [
    '''{"type":"response.failed","response":{"error":{"type":"rate_limit_error","code":"rate_limit_exceeded","message":"too many requests"}}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Through once the limit lifted."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"Through once the limit lifted."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed"}''',
]
