provider = "anthropic"
model = "claude-opus-5"
effort = "medium"
tasks-running-into-resume = ["build"]

[[tool]]
name = "bash"
outputs = ["restarted command"]

[[tool]]
name = "task"

[first]
prompt = "remember this running task"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"I will check it later."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "what happened to build"
settle-tasks-after-tool-result = true

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_1","name":"task","input":{}}}''',
