provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "snapshot"
outputs = ["snapshot.png"]
image = "2400x1200"
image-bytes = 57245
state-key = "snapshot-count"

[[tool]]
name = "thumbnail"
outputs = ["thumbnail.png"]
image = "800x600"
image-bytes = 8973
state-key = "thumbnail-count"

[first]
prompt = "show me both pictures"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_1","name":"snapshot","input":{}}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"tool_use","id":"toolu_2","name":"thumbnail","input":{}}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"I can see both pictures."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "describe the larger one"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"The larger one is a plain blue field."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
