provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "receive a rate limit that says not to ask again"

[[first.response]]
status = 429
body = '''{"error":{"message":"Usage credits are required for fast mode.","type":"rate_limit_error"},"request_id":"request-1","type":"error"}'''
headers = { Content-Type = "application/json", X-Should-Retry = "false", Anthropic-Ratelimit-Unified-Overage-Disabled-Reason = "org_level_disabled" }

[resume]
prompt = "continue after the final refusal"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Resumed."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
