provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "bash"
detaches = true
outputs = ["tests passed", "build finished"]

[[tool]]
name = "task"

[first]
prompt = "run the slow tests as checks, then start the build in the background"
settle-tasks-after-tool-result = true

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"bash","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-1","delta":"{\"task_name\":\"checks\"}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-1","arguments":"{\"task_name\":\"checks\"}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"bash","arguments":"{\"task_name\":\"checks\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-2","type":"function_call","call_id":"call-2","name":"bash","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-2","delta":"{\"background\":true}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-2","arguments":"{\"background\":true}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-2","type":"function_call","call_id":"call-2","name":"bash","arguments":"{\"background\":true}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-3","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The slow tests moved to the background and the build was scheduled."}''',
    '''{"type":"response.output_text.done","text":"The slow tests moved to the background and the build was scheduled."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The slow tests moved to the background and the build was scheduled."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-3","type":"message","role":"assistant","content":[{"type":"output_text","text":"The slow tests moved to the background and the build was scheduled."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-4","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Both tasks have finished."}''',
    '''{"type":"response.output_text.done","text":"Both tasks have finished."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Both tasks have finished."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-4","type":"message","role":"assistant","content":[{"type":"output_text","text":"Both tasks have finished."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
