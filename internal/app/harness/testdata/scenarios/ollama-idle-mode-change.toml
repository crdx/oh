provider = "ollama"
model = "qwen3.8:27b-mtp-q8_0-256k"
effort = "high"
toggle-before-first = "w"

[first]
prompt = "continue with the new mode"

[[first.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":"The workspace is read-only."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "continue"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":"Continued."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
