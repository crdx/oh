provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[[tool]]
name = "bash"
shell-withheld = true

[first]
prompt = "run a command while shell access is withheld"

[[first.response]]
event = [
    '''{"choices":[{"delta":{"role":"assistant","content":null,"reasoning_content":""}}]}''',
    '''{"choices":[{"delta":{"tool_calls":[{"index":0,"id":"call-1","type":"function","function":{"name":"bash","arguments":"{\"command\":\"echo forbidden\"}"}}]}}]}''',
    '''{"choices":[{"delta":{"content":"","reasoning_content":""},"finish_reason":"tool_calls"}]}''',
    '''[DONE]''',
]

[[first.response]]
event = [
    '''{"choices":[{"delta":{"content":"Shell access is unavailable."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]

[resume]
prompt = "continue after the refused command"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Resumed after the refusal."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
