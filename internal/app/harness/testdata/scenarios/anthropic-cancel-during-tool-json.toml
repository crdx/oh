provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "work"
outputs = ["unused"]
state-key = "work-count"

[first]
prompt = "interrupt while forming a tool call"
is-cancelled = true

[[first.response]]
cancel-after-wire-event = 3
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"tool_use","id":"toolu_1","name":"work","input":{}}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"input_json_delta","partial_json":"{\"value\":"}}''',
]

[resume]
prompt = "continue without the incomplete call"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Resumed."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
