provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "interrupt an unfinished summary"
is-cancelled = true
cancel-after-reasoning-delta = 1

[[first.response]]
wait-for-cancellation = true
event = [
    '''{"type":"response.reasoning_summary_text.delta","delta":"Unfinished summary."}''',
]

[resume]
prompt = "continue after the first response"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Resumed."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Resumed."}]}}''',
    '''{"type":"response.completed"}''',
]
