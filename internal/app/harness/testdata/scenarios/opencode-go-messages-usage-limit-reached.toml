provider = "opencode-go"
model = "qwen3.8-max"
effort = "medium"

[first]
prompt = "reach the OpenCode Go usage limit"

[[first.response]]
status = 429
body = '''{"type":"error","error":{"type":"GoUsageLimitError","message":"Monthly usage limit reached. Resets in 1 day. To continue using this model now, enable usage from your available balance: https://opencode.ai/workspace/workspace-1/go"},"metadata":{"workspace":"workspace-1","limitName":"monthly"}}'''
headers = { Content-Type = "text/plain;charset=UTF-8", Retry-After = "165899" }

[resume]
prompt = "continue after the early reset"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{"usage":{"input_tokens":10,"output_tokens":1}}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Available after the reset."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"},"usage":{"output_tokens":5}}''',
    '''{"type":"message_stop"}''',
]
