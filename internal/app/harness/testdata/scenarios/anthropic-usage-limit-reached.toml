provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "reach the Anthropic usage limit"

[[first.response]]
status = 429
body = '''{"type":"error","error":{"type":"rate_limit_error","message":"This request would exceed your account's rate limit. Please try again later."},"request_id":"request-1"}'''
headers = { Content-Type = "application/json", Retry-After = "5936", Anthropic-Ratelimit-Unified-Status = "rejected", Anthropic-Ratelimit-Unified-Representative-Claim = "five_hour", Anthropic-Ratelimit-Unified-5h-Status = "rejected", Anthropic-Ratelimit-Unified-5h-Utilization = "1.0", Anthropic-Ratelimit-Unified-5h-Reset = "1787652600", Anthropic-Ratelimit-Unified-7d-Status = "allowed", Anthropic-Ratelimit-Unified-7d-Utilization = "0.63", Anthropic-Ratelimit-Unified-7d-Reset = "1787648400" }

[resume]
prompt = "continue after the early reset"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Available after the reset."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
