provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[[tool]]
name = "work"
outputs = ["done"]

[first]
prompt = "keep thoughts that arrive with an empty signature"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"The work tool "}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"should settle this."}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"signature_delta","signature":""}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"tool_use","id":"toolu_1","name":"work","input":{}}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"input_json_delta","partial_json":"{}"}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"tool_use"}}''',
    '''{"type":"message_stop"}''',
]

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":"","signature":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"It said done."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":"The work is done."}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Carrying on."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
