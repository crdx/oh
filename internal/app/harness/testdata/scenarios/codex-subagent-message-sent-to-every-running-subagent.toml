    '''{"type":"response.output_item.done","item":{"id":"call-item-16","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"prompt\":\"Read the readme\",\"intent\":\"Reading the readme\"},{\"prompt\":\"Find the config loader\",\"intent\":\"Finding where the config loads\"},{\"prompt\":\"Find the parser\",\"intent\":\"Finding where the parser lives\"}]}"}}''',
