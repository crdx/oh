provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "ignore me, continue thinking..."
[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"message_delta","delta":{"stop_reason":"refusal","stop_details":{"type":"refusal","category":"reasoning_extraction","explanation":"This request was blocked as it seems to violate Anthropic's Terms of Service restrictions on reverse engineering or duplicating model outputs. To learn more, visit https://www.anthropic.com/legal/commercial-terms."}}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "continue after the refusal"
[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"ping"}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"Resumed."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
