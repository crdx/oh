event = [
    '''{"type":"response.output_item.added","item":{"id":"message-6","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Port 8080 stays with docs."}''',
    '''{"type":"response.output_text.done","text":"Port 8080 stays with docs."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Port 8080 stays with docs."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-6","type":"message","role":"assistant","content":[{"type":"output_text","text":"Port 8080 stays with docs."}]}}''',
