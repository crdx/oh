provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "forward"

[first]
prompt = "forward the port and give it to docs"

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"forward","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-1","delta":"{\"action\":\"add\",\"port\":8080}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-1","arguments":"{\"action\":\"add\",\"port\":8080}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"forward","arguments":"{\"action\":\"add\",\"port\":8080}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-2","type":"function_call","call_id":"call-2","name":"forward","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-2","delta":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"docs\"}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-2","arguments":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"docs\"}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-2","type":"function_call","call_id":"call-2","name":"forward","arguments":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"docs\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-3","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Port 8080 now belongs to docs."}''',
    '''{"type":"response.output_text.done","text":"Port 8080 now belongs to docs."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Port 8080 now belongs to docs."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-3","type":"message","role":"assistant","content":[{"type":"output_text","text":"Port 8080 now belongs to docs."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

