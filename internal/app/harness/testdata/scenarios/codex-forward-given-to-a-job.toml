prompt = "give it to docs again, then to the api"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-4","type":"function_call","call_id":"call-3","name":"forward","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-4","delta":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"docs\"}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-4","arguments":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"docs\"}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-4","type":"function_call","call_id":"call-3","name":"forward","arguments":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"docs\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-5","type":"function_call","call_id":"call-4","name":"forward","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-5","delta":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"api\"}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-5","arguments":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"api\"}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-5","type":"function_call","call_id":"call-4","name":"forward","arguments":"{\"action\":\"add\",\"port\":8080,\"job_name\":\"api\"}"}}''',
