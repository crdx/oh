provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
toggle-before-first = "w"

[first]
prompt = "continue with the new mode"

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"The workspace is read-only."}''',
    '''{"type":"response.output_text.done","text":"The workspace is read-only."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"The workspace is read-only."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "continue"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Continued."}''',
    '''{"type":"response.output_text.done","text":"Continued."}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Continued."}]}}''',
    '''{"type":"response.completed"}''',
]
