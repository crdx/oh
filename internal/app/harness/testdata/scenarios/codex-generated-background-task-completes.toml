provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[tool]]
name = "bash"
outputs = ["foreground check passed", "build finished"]

[[tool]]
name = "task"

[first]
prompt = "run a quick foreground check, then start the build in the background"
settle-tasks-after-tool-result = true

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-0","type":"function_call","call_id":"call-0","name":"bash","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-0","delta":"{}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-0","arguments":"{}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-0","type":"function_call","call_id":"call-0","name":"bash","arguments":"{}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"bash","arguments":""}}''',
    '''{"type":"response.function_call_arguments.delta","item_id":"call-item-1","delta":"{\"background\":true}"}''',
    '''{"type":"response.function_call_arguments.done","item_id":"call-item-1","arguments":"{\"background\":true}"}''',
    '''{"type":"response.output_item.done","item":{"id":"call-item-1","type":"function_call","call_id":"call-1","name":"bash","arguments":"{\"background\":true}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-2","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The generated background task finished."}''',
    '''{"type":"response.output_text.done","text":"The generated background task finished."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The generated background task finished."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"The generated background task finished."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-3","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The build remains complete."}''',
    '''{"type":"response.output_text.done","text":"The build remains complete."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The build remains complete."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-3","type":"message","role":"assistant","content":[{"type":"output_text","text":"The build remains complete."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
