provider = "chat"
model = "deepseek-v4-pro"
effort = "medium"

[first]
prompt = "receive HTTP 429"

[[first.response]]
repeat = 19
status = 429

[resume]
prompt = "continue after the transport failure"

[[resume.response]]
event = [
    '''{"choices":[{"delta":{"content":"Resumed."}}]}''',
    '''{"choices":[{"delta":{},"finish_reason":"stop"}]}''',
    '''[DONE]''',
]
