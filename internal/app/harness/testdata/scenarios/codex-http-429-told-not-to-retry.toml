provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "receive a rate limit that says not to ask again"

[[first.response]]
status = 429
body = '''{"error":{"message":"Rate limit reached for this account.","type":"rate_limit_error"}}'''
headers = { Content-Type = "application/json", X-Should-Retry = "false" }

[resume]
prompt = "continue after the final refusal"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Resumed."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Resumed."}]}}''',
    '''{"type":"response.completed"}''',
]
