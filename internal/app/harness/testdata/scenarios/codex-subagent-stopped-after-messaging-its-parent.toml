provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[subagent]]
name = "tame-adder"

[[subagent.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-11","type":"function_call","call_id":"toolu_21","name":"message_parent","arguments":"{\"message\":\"Found two candidates; narrowing down.\"}"}}''',
    '''{"type":"response.completed","response":{"status":"completed","usage":{"input_tokens":1200,"output_tokens":30,"input_tokens_details":{"cached_tokens":0,"cache_write_tokens":0}}}}''',
]

[[subagent.response]]
wait-for-cancellation = true

[first]
prompt = "start a subagent and stop it once it reports"
settle-subagents-after-tool-results = [1, 2]
subagent-debounce-passes = true

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-12","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"model\":\"codex/gpt-5.6-sol@medium\",\"prompt\":\"Find the slow query\",\"intent\":\"Finding the slowest database query\"}]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-13","type":"function_call","call_id":"toolu_2","name":"subagent","arguments":"{\"action\":\"stop\",\"names\":[\"tame-adder\"]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-14","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Stopped it after its update."}''',
    '''{"type":"response.output_text.done","text":"Stopped it after its update."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Stopped it after its update."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-14","type":"message","role":"assistant","content":[{"type":"output_text","text":"Stopped it after its update."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-15","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_text.done","text":"Carrying on."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Carrying on."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-15","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
