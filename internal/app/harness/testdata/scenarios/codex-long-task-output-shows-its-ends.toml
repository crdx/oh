provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"
end-task-before-first = "build"
end-task-output = "ok  crdx.org/oh/internal/app/config\nok  crdx.org/oh/internal/app/painter\nok  crdx.org/oh/internal/app/taskrecord\nok  crdx.org/oh/internal/app/toolresult\nok  crdx.org/oh/internal/toolresult\nok  crdx.org/oh/pkg/agent\nok  crdx.org/oh/pkg/tasks\n--- FAIL: TestDraw (0.00s)\nFAIL crdx.org/oh/cmd/oh"
end-task-intent = "Running every package test once more"
task-output-lines = 3

[first]
prompt = "what happened to the build"

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-1","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"It failed after twelve seconds: getWidth is undefined in draw.go."}''',
    '''{"type":"response.output_text.done","text":"It failed after twelve seconds: getWidth is undefined in draw.go."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"It failed after twelve seconds: getWidth is undefined in draw.go."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-1","type":"message","role":"assistant","content":[{"type":"output_text","text":"It failed after twelve seconds: getWidth is undefined in draw.go."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-2","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_text.done","text":"Carrying on."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Carrying on."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-2","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
