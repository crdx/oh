provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "count what the answer cost"

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"That cost a little."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"That cost a little."}]}}''',
    '''{"type":"response.completed","response":{"usage":{"input_tokens":5000,"output_tokens":280,"input_tokens_details":{"cached_tokens":4000,"cache_write_tokens":500}}}}''',
]

[resume]
prompt = "carry on"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"usage":{"input_tokens":5200,"output_tokens":50,"input_tokens_details":{"cached_tokens":5000,"cache_write_tokens":0}}}}''',
]
