provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[[subagent]]
name = "tame-adder"

[[subagent.response]]
wait-for-cancellation = true

[first]
prompt = "start a long subagent"
settle-subagents-after-turn = true

[[first.response]]
event = [
    '''{"type":"response.output_item.done","item":{"id":"call-item-18","type":"function_call","call_id":"toolu_1","name":"subagent","arguments":"{\"action\":\"start\",\"subagents\":[{\"prompt\":\"Watch the build forever\",\"intent\":\"Watching the build until stopped\"}]}"}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[first.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-19","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"It is running."}''',
    '''{"type":"response.output_text.done","text":"It is running."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"It is running."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-19","type":"message","role":"assistant","content":[{"type":"output_text","text":"It is running."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[resume]
prompt = "carry on"
deliver-subagents-before-prompt = true

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-20","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"The subagent ended with the last session."}''',
    '''{"type":"response.output_text.done","text":"The subagent ended with the last session."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"The subagent ended with the last session."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-20","type":"message","role":"assistant","content":[{"type":"output_text","text":"The subagent ended with the last session."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]

[[resume.response]]
event = [
    '''{"type":"response.output_item.added","item":{"id":"message-21","type":"message","role":"assistant","content":[]}}''',
    '''{"type":"response.content_part.added","part":{"type":"output_text","text":""}}''',
    '''{"type":"response.output_text.delta","delta":"Carrying on."}''',
    '''{"type":"response.output_text.done","text":"Carrying on."}''',
    '''{"type":"response.content_part.done","part":{"type":"output_text","text":"Carrying on."}}''',
    '''{"type":"response.output_item.done","item":{"id":"message-21","type":"message","role":"assistant","content":[{"type":"output_text","text":"Carrying on."}]}}''',
    '''{"type":"response.completed","response":{"status":"completed"}}''',
]
