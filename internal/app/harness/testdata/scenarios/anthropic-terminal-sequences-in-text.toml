provider = "anthropic"
model = "claude-opus-5"
effort = "medium"

[first]
prompt = "read the page and tell me what it says"

[[first.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"thinking","thinking":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"thinking_delta","thinking":"The page says \u001b[2Jsomething odd."}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"content_block_start","index":1,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":"The page said: paste \u001b]52;c;"}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":"aGVsbG8=\u0007 and visit \u001b]8;;https://example.com\u001b\\here\u001b]8;;\u001b\\"}}''',
    '''{"type":"content_block_delta","index":1,"delta":{"type":"text_delta","text":", which I would not.\u001b[2J"}}''',
    '''{"type":"content_block_stop","index":1}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]

[resume]
prompt = "say that again \u001b[2J"

[[resume.response]]
event = [
    '''{"type":"message_start","message":{}}''',
    '''{"type":"content_block_start","index":0,"content_block":{"type":"text","text":""}}''',
    '''{"type":"content_block_delta","index":0,"delta":{"type":"text_delta","text":"It asked to be pasted, and I would not.\u0007"}}''',
    '''{"type":"content_block_stop","index":0}''',
    '''{"type":"message_delta","delta":{"stop_reason":"end_turn"}}''',
    '''{"type":"message_stop"}''',
]
