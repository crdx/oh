provider = "codex"
model = "gpt-5.6-sol"
effort = "medium"

[first]
prompt = "close before producing output"

[[first.response]]
event = []

[[first.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Answered on the second attempt."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Answered on the second attempt."}]}}''',
    '''{"type":"response.completed"}''',
]

[resume]
prompt = "continue after the first response"

[[resume.response]]
event = [
    '''{"type":"response.output_text.delta","delta":"Resumed."}''',
    '''{"type":"response.output_item.done","item":{"type":"message","role":"assistant","content":[{"type":"output_text","text":"Resumed."}]}}''',
    '''{"type":"response.completed"}''',
]
